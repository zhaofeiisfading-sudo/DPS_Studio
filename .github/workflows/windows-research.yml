name: Windows Research test build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows-constraints.txt
      - run: python -m pip install -c packaging/windows-constraints.txt -e ".[dev]"
      - run: python -m ruff check src/dps_studio/core src/dps_studio/gui
      - run: python -m mypy src/dps_studio/core src/dps_studio/gui
      - run: python -m pytest -q tests/unit/test_analysis_profiles.py tests/unit/test_local_peak_candidates.py tests/unit/test_acceleration.py tests/unit/test_local_acceleration.py tests/unit/test_acceleration_export.py tests/unit/gui/test_task014_export.py
      - run: python -m PyInstaller --distpath dist --workpath build packaging/pdv_research.spec
      - name: Launch frozen application
        shell: pwsh
        run: |
          $exe = Get-Item 'dist/PDV_Studio_Research_TASK014/PDV Studio Research TASK014.exe'
          $report = Join-Path $PWD 'startup.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--startup-smoke-test `"$report`"" -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0 -or !(Get-Content $report -Raw | ConvertFrom-Json).event_loop_entered) { throw 'Startup failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PDV-Studio-Research-Windows-x64
          path: dist/PDV_Studio_Research_TASK014/
          if-no-files-found: error
