# Built-in scientific defaults for the PDV Studio desktop application.
# The GUI always analyzes records explicitly imported by the user; input.path is
# retained only because this file uses the shared WorkflowConfiguration schema.
[input]
path = "."
time_column = 0
delimiter = ","
has_header = false
encoding = "utf-8"
time_scale = 1.0

[input.voltage_columns]
pdv_channel_1 = 1
pdv_channel_2 = 2

[input.voltage_scales]
pdv_channel_1 = 1.0
pdv_channel_2 = 1.0

[analysis]
default_profile = "balanced"
profiles = ["very_high_time_resolution_experimental", "high_time_resolution", "balanced", "high_frequency_resolution", "very_high_frequency_resolution_experimental"]
# Preferred laboratory acquisition window. The GUI uses it only when it lies
# completely inside the records currently imported by the user; otherwise it
# falls back to the complete common channel range.
analysis_start_time_s = 5.5396025426e-4
analysis_end_time_s = 5.5596022926e-4
# User-confirmed vacuum wavelength of the laboratory PDV laser.
vacuum_wavelength_m = 1.55e-6

[velocity_correction]
# Formal core units are radians. The GUI exposes this value in degrees.
window_material = "LiF"
measurement_angle_rad = 0.0
lif_b1 = 0.7895
lif_b2 = 0.9918
lif_reference_wavelength_m = 1.55e-6

[quality]
background_guard_window_scale = 2.0
minimum_background_bin_count = 2
# A new or reacquired formal segment must meet the strict 10 dB gate for three
# consecutive frames. Once established, a continuous path may track at 7 dB.
minimum_peak_to_background_db = 10.0
tracking_minimum_peak_to_background_db = 7.0
minimum_peak_to_competitor_db = 3.0
maximum_tracking_frequency_step_hz = 1.5e8
peak_exclusion_half_width_bins = 12
minimum_consecutive_frames = 3
minimum_cycles_in_window = 1.0
enabled = true

[automatic_ridge_selection]
mode = "continuity_assisted"
top_k_candidates = 3
continuity_reselection_enabled = true
# The production rescue background threshold matches the formal quality gate.
minimum_candidate_peak_to_background_db = 10.0
minimum_candidate_relative_to_strongest_db = -6.0
# recovery_tolerance_hz is intentionally omitted: each run resolves it from
# sample_rate_hz / window_length_samples, the existing STFT window scale.

[event_candidate]
minimum_segment_frames = 8
minimum_segment_duration_s = 2.0e-8
maximum_adjacent_frequency_step_hz = 1.5e8

[event_consensus]
channel_start_time_tolerance_s = 2.5e-8
minimum_interval_overlap_fraction = 0.5
channel_start_frequency_tolerance_hz = 1.5e8
cross_profile_time_tolerance_s = 2.5e-8

[plot]
relative_db_floor = -60.0
analysis_display_minimum_frequency_hz = 0.0
analysis_display_maximum_frequency_hz = 2.0e9
event_detail_before_s = 1.0e-7
event_detail_after_s = 2.0e-7
assume_pre_event_zero_for_display = true
pre_event_display_velocity_m_s = 0.0

[output]
root = "outputs/production_runs"
