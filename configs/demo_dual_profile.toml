[input]
path = "data/raw/20260607.csv"
time_column = 0
delimiter = ","
has_header = false
encoding = "utf-8"
time_scale = 1.0

[input.voltage_columns]
pdv_channel_1 = 1
pdv_channel_2 = 2

[input.voltage_scales]
pdv_channel_1 = 1.0
pdv_channel_2 = 1.0

[analysis]
profiles = ["balanced", "high_time_resolution"]
# The analysis window explicitly covers the complete current raw record.
analysis_start_time_s = 5.5396025426e-4
analysis_end_time_s = 5.5596022926e-4
# Optional plotting/review reference only; it never gates ridge or quality work.
manual_event_reference_time_s = 5.54668e-4
# Demonstration value only; not confirmed against the experiment record.
vacuum_wavelength_m = 1.55e-6

[velocity_correction]
window_material = "LiF"
measurement_angle_rad = 0.0

[quality]
# Retained for legacy descriptive scripts; formal detection uses the bin guard below.
background_guard_window_scale = 2.0
minimum_background_bin_count = 2
# TASK-013C-R development calibration compared exactly (10,3), (12,4),
# (14,5), and (16,6) dB. No stricter pair met every retention/continuity
# criterion, so the deterministic fallback retains 10/3 dB.
# This is not an absolute experimental standard.
minimum_peak_to_background_db = 10.0
minimum_peak_to_competitor_db = 3.0
peak_exclusion_half_width_bins = 12
minimum_consecutive_frames = 3
minimum_cycles_in_window = 1.0
enabled = true

[event_candidate]
# Independent development defaults for segment-level event eligibility.
# Duration is first-to-last STFT frame-center span, not window coverage.
minimum_segment_frames = 8
minimum_segment_duration_s = 2.0e-8
maximum_adjacent_frequency_step_hz = 1.0e8
# Optional median contrast gates are deliberately omitted. The per-frame
# 10 dB / 3 dB rules are not silently duplicated at the event level.

[event_consensus]
# Consensus metadata only; no raw-voltage, frequency, or velocity fusion.
channel_start_time_tolerance_s = 2.5e-8
minimum_interval_overlap_fraction = 0.5
channel_start_frequency_tolerance_hz = 1.5e8
cross_profile_time_tolerance_s = 2.5e-8

[plot]
relative_db_floor = -60.0
analysis_display_minimum_frequency_hz = 0.0
analysis_display_maximum_frequency_hz = 2.0e9
event_detail_before_s = 1.0e-7
event_detail_after_s = 2.0e-7
assume_pre_event_zero_for_display = true
pre_event_display_velocity_m_s = 0.0

[output]
root = "outputs/production_runs"
